experiment_id: gpt41mini_ml1m
dataset: ml1m
sample_size: 1500
sample_seed: 42
test_split: 0.7
top_k: 20
history_limit: 10
rank_weight: 0.2
popularity_csv: movies_with_popularity.csv

llm:
  provider: openai
  model: gpt-4.1-mini
  temperature: 0.7
  top_p: 1.0
  max_tokens: 1000
  max_retries: 6
  timeout: 60

rerank:
  alpha_base: 0.7
  alpha_min: 0.5
  alpha_max: 0.9
  alpha_gain: 0.2
  base: 0.2
  decay_rate: 0.9
  disable_dynamic_alpha: false
