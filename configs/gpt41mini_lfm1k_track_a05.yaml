experiment_id: gpt41mini_lfm1k_track_a05
dataset: lastfm1k
granularity: track
include_country: false
min_track_listeners: 3

popularity_csv: data/processed/lastfm1k_track/items_with_popularity.csv

# Separate output root to keep this side-by-side with the alpha=0.7 baseline
# (results/) instead of clobbering it.
output_root: results_a05

sample_size: 600
sample_seed: 42
test_split: 0.7
top_k: 20
candidate_pool_size: 30
history_limit: 25
rank_weight: 0.2

llm:
  provider: openai
  model: gpt-4.1-mini
  temperature: 0.7
  max_tokens: 1500
  system_prompt: "You are a professional music recommendation system that recommends individual songs."

# More aggressive popularity debias.
# alpha_base 0.7 -> 0.5 trusts LLM ordering less, gives the (1-B) bonus more
# weight. alpha_min/max stay symmetric around the base so dynamic alpha
# still has +/- 0.2 swing room based on the user's mainstream-ness.
rerank:
  alpha_base: 0.5
  alpha_min: 0.3
  alpha_max: 0.7
  alpha_gain: 0.2
  base: 0.2
  decay_rate: 0.9
